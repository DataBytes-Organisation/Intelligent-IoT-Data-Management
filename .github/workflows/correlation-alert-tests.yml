name: Correlation Alert Tests

on:
  push:
    paths:
      - "correlation_alert/**"
      - ".github/workflows/correlation-alert-tests.yml"
  pull_request:
    paths:
      - "correlation_alert/**"
      - ".github/workflows/correlation-alert-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: correlation_alert/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r correlation_alert/requirements.txt

      - name: Run correlation tests
        run: python -m pytest correlation_alert/tests -q
